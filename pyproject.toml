[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remotebrowser"
dynamic = ["version"]
description = "Python SDK for Remote Browser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["remotebrowser", "browser", "cdp", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://remotebrowser.ai"

[project.scripts]
remotebrowser = "remotebrowser._cli:main"

[tool.hatch.version]
path = "src/remotebrowser/_version.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
